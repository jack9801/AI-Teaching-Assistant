[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-teaching-assistant-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "uvloop>=0.20,<1", "langgraph>=0.2,<1", "sympy>=1.13,<2", "litellm>=1.50,<2", "pydantic>=2.8,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[tool.setuptools]
packages = ["agent"]
