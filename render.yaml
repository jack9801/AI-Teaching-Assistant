services:
  - type: web
    name: ai-teaching-worker
    runtime: docker
    plan: free
    region: oregon
    rootDir: worker
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_ENABLED
        value: false
      - key: LLM_MODEL
        value: anthropic/claude-3-5-sonnet-20241022
      - key: WORKER_SHARED_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: ai-teaching-gateway
    runtime: docker
    plan: free
    region: oregon
    rootDir: gateway
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: WORKER_HOSTPORT
        fromService:
          type: web
          name: ai-teaching-worker
          property: hostport
      - key: WORKER_SHARED_SECRET
        fromService:
          type: web
          name: ai-teaching-worker
          envVarKey: WORKER_SHARED_SECRET
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-teaching-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://ai-teaching-gateway.onrender.com

  - type: keyvalue
    name: ai-teaching-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
