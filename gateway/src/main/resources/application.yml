server:
  port: ${PORT:8080}
spring:
  application:
    name: ai-teaching-assistant-gateway
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
app:
  worker:
    base-url: ${WORKER_BASE_URL:http://localhost:8000}
    shared-secret: ${WORKER_SHARED_SECRET:}
    connect-timeout-ms: 1500
    response-timeout-seconds: 90
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
