server:
  port: 8080
spring:
  application:
    name: ai-teaching-assistant-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
app:
  worker:
    base-url: ${WORKER_BASE_URL:http://localhost:8000}
    connect-timeout-ms: 1500
    response-timeout-seconds: 25
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
