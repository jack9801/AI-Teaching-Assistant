<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI Teaching Assistant</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px}#chat{min-height:400px;border:1px solid #ddd;padding:16px;border-radius:12px}.m{margin:10px;padding:10px;border-radius:10px;background:#f3f3f3}.u{background:#e8f0ff}form{display:flex;gap:8px;margin-top:12px}textarea{flex:1;padding:10px}button{padding:10px 18px}</style></head><body><h1>AI Teaching Assistant</h1><p>Socratic tutor · 8th-grade linear equations</p><div id="chat"><div class="m">I won't give away the final answer. Try a step and I'll guide you.</div></div><form><textarea id="i" placeholder="Try: 3x + 5 = 20"></textarea><button>Send</button></form><script>let id=localStorage.id||crypto.randomUUID();localStorage.id=id;let c=document.querySelector('#chat'),i=document.querySelector('#i');document.querySelector('form').onsubmit=async e=>{e.preventDefault();let m=i.value.trim();if(!m)return;i.value='';let u=document.createElement('div');u.className='m u';u.textContent=m;c.append(u);let a=document.createElement('div');a.className='m';c.append(a);let r=await fetch('/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:id,message:m})});let rd=r.body.getReader(),d=new TextDecoder(),b='';while(1){let x=await rd.read();if(x.done)break;b+=d.decode(x.value);let q=b.split('\n\n');b=q.pop();q.forEach(z=>{if(z.includes('event: text'))a.textContent+=z.split('data: ')[1]?.trim()||''})}};</script></body></html>
