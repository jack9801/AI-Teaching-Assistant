<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>AI Teaching Assistant</title>
<style>
body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px}
#chat{min-height:400px;border:1px solid #ddd;padding:16px;border-radius:12px}
.m{margin:10px;padding:10px;border-radius:10px;background:#f3f3f3;white-space:pre-wrap}
.u{background:#e8f0ff}
form{display:flex;gap:8px;margin-top:12px}
textarea{flex:1;padding:10px;resize:vertical}
button{padding:10px 18px}
button:disabled{opacity:.6}
.err{background:#ffe8e8}
</style>
</head>
<body>
<h1>AI Teaching Assistant</h1>
<p>Socratic tutor · 8th-grade linear equations</p>
<div id="chat">
<div class="m">I won't give away the final answer. Try a step and I'll guide you.</div>
</div>
<form>
<textarea id="i" rows="3" placeholder="Try: 3x + 5 = 20"></textarea>
<button id="s">Send</button>
</form>
<script>
let id=localStorage.id||crypto.randomUUID();
localStorage.id=id;
const c=document.querySelector('#chat');
const i=document.querySelector('#i');
const s=document.querySelector('#s');

function addMessage(text, cls){
  const el=document.createElement('div');
  el.className='m'+(cls?' '+cls:'');
  el.textContent=text;
  c.append(el);
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
  return el;
}

document.querySelector('form').onsubmit=async e=>{
  e.preventDefault();
  const m=i.value.trim();
  if(!m||s.disabled)return;
  i.value='';
  addMessage(m,'u');
  const a=addMessage('');
  s.disabled=true;

  try{
    const r=await fetch('/api/v1/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'text/event-stream'},
      body:JSON.stringify({sessionId:id,message:m})
    });

    if(!r.ok){
      throw new Error('Chat request failed ('+r.status+')');
    }
    if(!r.body){
      throw new Error('Streaming response is not available');
    }

    const reader=r.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';

    while(true){
      const {value,done}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});

      const events=buffer.split(/\r?\n\r?\n/);
      buffer=events.pop()||'';

      for(const event of events){
        let type='';
        const dataLines=[];
        for(const line of event.split(/\r?\n/)){
          if(line.startsWith('event:')) type=line.slice(6).trim();
          else if(line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
        }

        const data=dataLines.join('\n');
        if(type==='text'){
          a.textContent+=data;
        }else if(type==='error'){
          try{
            const payload=JSON.parse(data);
            a.textContent=payload.message||data||'Tutor service error';
          }catch{
            a.textContent=data||'Tutor service error';
          }
          a.classList.add('err');
        }
      }
    }

    if(!a.textContent.trim()){
      a.textContent='The tutor returned no response. Please try again.';
      a.classList.add('err');
    }
  }catch(err){
    a.textContent=err.message||'The tutor service is temporarily unavailable.';
    a.classList.add('err');
  }finally{
    s.disabled=false;
    i.focus();
  }
};
</script>
</body>
</html>
