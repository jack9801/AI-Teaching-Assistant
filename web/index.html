<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Teaching Assistant</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f6f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:32px 16px}.card{background:#fff;border-radius:18px;box-shadow:0 12px 40px #0001;overflow:hidden}header{padding:24px;border-bottom:1px solid #e6e8ef}h1{margin:0 0 6px}.sub{color:#65708a}#chat{min-height:460px;max-height:65vh;overflow:auto;padding:20px}.msg{max-width:78%;margin:10px 0;padding:12px 14px;border-radius:14px;line-height:1.45;white-space:pre-wrap}.user{margin-left:auto;background:#e9f1ff}.assistant{background:#f1f3f8}form{display:flex;gap:10px;padding:16px;border-top:1px solid #e6e8ef}textarea{flex:1;min-height:58px;border:1px solid #cfd5e2;border-radius:12px;padding:12px;font:inherit}button{border:0;border-radius:12px;padding:0 18px;font-weight:700}.hint{padding:0 20px 18px;color:#65708a;font-size:14px}</style></head><body><div class="wrap"><div class="card"><header><h1>AI Teaching Assistant</h1><div class="sub">Phase 1 · 8th-grade linear equations · Socratic tutoring</div></header><div id="chat"><div class="msg assistant">Hi! I won't give away the final answer. Try a step and I'll guide you.</div></div><div class="hint">Try <b>3x + 5 = 20</b>, then send your next step.</div><form id="form"><textarea id="input" required placeholder="Type your equation or next step..."></textarea><button>Send</button></form></div></div><script>const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#input');let sessionId=localStorage.getItem('aiTeacherSession')||crypto.randomUUID();localStorage.setItem('aiTeacherSession',sessionId);function add(r,t=''){let e=document.createElement('div');e.className='msg '+r;e.textContent=t;chat.appendChild(e);chat.scrollTop=chat.scrollHeight;return e}form.onsubmit=async e=>{e.preventDefault();let message=input.value.trim();if(!message)return;input.value='';add('user',message);let bubble=add('assistant');try{let res=await fetch('/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId,message})});if(!res.ok||!res.body){bubble.textContent='Tutor unavailable.';return}let rd=res.body.getReader(),de=new TextDecoder(),buf='';for(;;){let {value,done}=await rd.read();if(done)break;buf+=de.decode(value,{stream:true});let cs=buf.split('\n\n');buf=cs.pop();for(let c of cs){if(!c.startsWith('data:'))continue;let d=c.slice(5).trim(),t=(c.match(/^event:\s*(.*)$/m)||[,''])[1];if(t==='text')bubble.textContent+=d;if(t==='error')bubble.textContent=d;chat.scrollTop=chat.scrollHeight}}}catch{bubble.textContent='Tutor unavailable.'}}</script></body></html>
